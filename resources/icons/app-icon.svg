<?xml version="1.0" encoding="UTF-8"?>
<!-- 键影 KeyShadow 应用图标母版：半影键帽，青绿实键 + 影紫斜切面 -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>KeyShadow</title>
  <defs>
    <clipPath id="knob">
      <rect x="104" y="104" width="304" height="304" rx="70"/>
    </clipPath>
  </defs>
  <rect width="512" height="512" rx="96" fill="#12151A"/>
  <g clip-path="url(#knob)">
    <rect x="104" y="104" width="304" height="304" fill="#00D9B8"/>
    <polygon points="408,104 408,408 104,408" fill="#7C6BFF"/>
    <line x1="104" y1="408" x2="408" y2="104" stroke="#12151A" stroke-width="16"/>
  </g>
</svg>
